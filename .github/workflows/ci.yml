name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/hono_starter
  BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
  API_URL: http://localhost:3199
  WEB_URL: http://localhost:5199

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hono_starter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hono_starter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - name: API unit and integration tests
        run: bun test
        working-directory: apps/api
      - name: Web build
        run: bun run build
        working-directory: apps/web
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
      - name: End-to-end tests
        run: npx playwright test
        working-directory: apps/e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
